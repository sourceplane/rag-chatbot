apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: Vercel's AI SDK RAG chatbot (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  domain: web
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # The Hyperdrive config must exist before this deploys (its id is rendered
  # into the Worker's HYPERDRIVE binding), and the schema — resources,
  # embeddings, the vector extension and the HNSW index — must be applied
  # before the Worker takes traffic (db-migrate, which itself waits on the
  # Supabase project).
  dependsOn:
    - component: cloudflare-hyperdrive
    - component: db-migrate
  secretEnv:
    # The wiring document the wrangler template is rendered from per
    # environment. AI_GATEWAY_API_KEY is a Worker secret set once per
    # environment (README → Deploying); the lane does not set it.
    WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://rag-chatbot/rag-chatbot/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
    WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://rag-chatbot/rag-chatbot/prod/WIRING_CLOUDFLARE_HYPERDRIVE"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: rag-chatbot-web-{dev,stage,prod}.
    workerName: rag-chatbot-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # Render this environment's wrangler config from the wiring document, then
    # build (the verify lane already rendered from the fixture through
    # `wire:fixture`; a deploy lane re-renders with the real Hyperdrive id).
    buildCommand: node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components cloudflare-hyperdrive --env "${ORUN_ENVIRONMENT}" && pnpm exec turbo run build --filter=@app/web

    # Smoke: the chat page renders (its title is in the pre-rendered shell)
    # before the database or the gateway are involved.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'Retrieval Augmented Generation Preview'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
