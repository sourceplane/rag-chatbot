apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: RG-3
  title: "The schema through db-migrate"
spec:
  goal: The template's schema is an Orun migration — packages/db carries its SQL verbatim with a checksummed manifest, tests/db verifies it, infra/db-migrate applies it per environment before the Worker deploys
  affects:
    - packages/db
    - tests/db
    - infra/db-migrate
    - tooling/migrations
    - pnpm-lock.yaml
  doneWhen:
    - pnpm --filter @saas/db run manifest:check passes
    - node packages/db/dist/runner/cli.js plan --env stage lists 000_control_baseline and 010_rag_initial
    - tests/db is green in Checks
  gates:
    - checks
