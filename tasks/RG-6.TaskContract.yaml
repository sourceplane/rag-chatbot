apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: RG-6
  title: "A baseline"
spec:
  goal: The repository is an Orun baseline on the Lumen conventions — a card and a build document that take a new RAG chatbot from nothing to live on stage and prod in one landing (Supabase, then Hyperdrive, then the migrations, then the app), branded as its own, chatting and embedding on Workers AI with no AI vendor key, every public table under row-level security, with gates that prove it offline
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - README.md
    - .baseline/**
    - tooling/rebrand/**
    - tooling/bootstrap/**
    - hooks/**
    - testing/**
    - docs/phases/**
    - ai/context/**
    - .github/workflows/**
    - .gitignore
    - intent.yaml
    - pnpm-workspace.yaml
    - pnpm-lock.yaml
    - apps/web/**
    - packages/db/**
    - infra/**
    - tests/web/**
    - tests/db/**
    - specs/**
    - tasks/**
  doneWhen:
    - orun (the bootstrap floor, the lane pin and 2.79.0) reads repo-blueprint.yaml, and the card agrees with it
    - the product's own push-to-main plan orders supabase → cloudflare-hyperdrive → db-migrate → web, enforced, and a pull request's plan holds the same edges advisory
    - a product built offline installs, migrates a local Postgres with pgvector with its own runner, builds in the job tree orun stages, serves, and with no AI vendor key adds a document through the chat, retrieves it by similarity and answers from it (Workers AI stood in for)
    - the as-built status records the departures and what is not yet proven live
  gates:
    - checks
