# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (RG → RG-1, RG-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: rag-chatbot
  key: RG
spec:
  title: "Vercel's AI SDK RAG chatbot on Cloudflare Workers with Supabase Postgres through Hyperdrive"
  summary: "The Vercel ai-sdk-preview-rag template — a retrieval-augmented chatbot: useChat on the client, streamText with tools (addResource, getInformation, understandQuery) on the server, resources chunked and embedded through the Vercel AI Gateway, embeddings stored in Postgres with pgvector through Drizzle — runs on Cloudflare Workers + Static Assets through @opennextjs/cloudflare. Its database is a Supabase project's Postgres (pgvector built in) reached through Cloudflare Hyperdrive, both provisioned by Terraform through Orun (the Lumen baseline's roots), and its schema — the template's own drizzle SQL — is applied by Orun's db-migrate component before the Worker deploys. The one change the Workers runtime forces is a per-call database client over the HYPERDRIVE binding; the AI Gateway key stays the SaaS key it is."
  state: draft
  milestones:
    - name: "RG0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [RG-1]
    - name: "RG1 — the chatbot on Workers"
      exitCriteria:
        - "apps/web is the upstream template, built by `next build` + `opennextjs-cloudflare build`, with lib/db/index.ts exporting a per-call getDb() over the HYPERDRIVE binding"
        - "the wrangler config renders per environment from the cloudflare-hyperdrive root's wiring document (fixture in verify, live in deploy)"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev` serves the chat page; POST /api/chat reaches the binding and the gateway"
      tasks: [RG-2]
    - name: "RG2 — the schema through db-migrate"
      exitCriteria:
        - "packages/db (@saas/db) carries the template's SQL verbatim as a manifest entry with its checksum; the offline plan lists it"
        - "infra/db-migrate applies it through Supabase's Management API before the Worker deploys; tests/db verifies the manifest"
      tasks: [RG-3]
    - name: "RG3 — Supabase and Hyperdrive from Terraform"
      exitCriteria:
        - "infra/terraform/supabase provisions the stage and prod projects and publishes ref, password, connection URI and keys as orun secrets"
        - "infra/terraform/cloudflare-hyperdrive provisions one Hyperdrive config per environment over that Postgres and publishes the wiring document the app renders"
        - "the app component depends on both and names the wiring it needs"
      tasks: [RG-4]
    - name: "RG4 — ready to instantiate"
      exitCriteria:
        - "the README says how to run it locally (a Postgres with pgvector, the gateway key), test, preview and deploy it through Orun, and where the Worker secret is set"
        - "the as-built status records every departure from the upstream template"
      tasks: [RG-5]
